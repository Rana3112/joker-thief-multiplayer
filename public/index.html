<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joker Thief - Play Now!</title>

  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #22213c;
      --bg2: #1e1b36;
      --panel-bg: rgba(24,30,52,0.92);
      --accent-1: #6b21a8;
      --accent-2: #e11d48;
      --text-primary: #fffafa;
      --muted: #cfd5ef;
    }

    html,body {
      height: 100%;
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    body{
      min-width: 300px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 60% 30%, var(--bg1), var(--bg2) 90%);
      padding: 24px;
      box-sizing: border-box;
    }

    .center-box{
      width: 100%;
      max-width: 520px;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding: 48px 36px 36px;
      background: var(--panel-bg);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(26,25,57,0.6);
      border: 1px solid rgba(255,255,255,0.03);
      transform: translateZ(0); /* fix for some browsers */
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:8px;
    }

    .brand img {
      width:44px;
      height:44px;
      object-fit:contain;
      border-radius:8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }

    h1{
      font-size: 2.1rem;
      color: var(--text-primary);
      margin: 6px 0 18px;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 14px rgba(85,31,255,0.22);
      font-weight:700;
    }

    .desc{
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 30px;
      line-height:1.4;
      max-width: 440px;
    }

    .btn-row{
      width:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }

    /* Primary button */
    .landing-btn{
      width: 100%;
      max-width: 360px;
      font-size: 1.06rem;
      padding: 14px 32px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, var(--accent-1) 0%, var(--accent-2) 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 3px 10px rgba(81,31,47,0.27);
      cursor:pointer;
      transition: transform .14s, box-shadow .14s;
      outline: none;
      letter-spacing: 0.4px;
    }

    .landing-btn:hover{ transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 30px rgba(81,15,62,0.22); }
    .landing-btn:active{ transform: translateY(-1px) scale(1.01); }
    .landing-btn:focus{ box-shadow: 0 0 0 4px rgba(99,66,255,0.14); }

    .secondary{
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: none;
      font-weight:500;
    }

    .coming-soon{
      font-size:0.92rem;
      color: #f59e0b;
      margin-top:10px;
      opacity:0.95;
      text-shadow: 0 1px 7px rgba(33,33,60,0.34);
    }

    /* Responsive: side-by-side buttons on larger screens */
    @media (min-width:740px){
      .btn-row{
        flex-direction:row;
        justify-content:center;
      }
      .landing-btn{ max-width: 260px; }
    }

    /* Mobile adjustments */
    @media (max-width:420px){
      .center-box{ padding: 28px 18px; border-radius:12px; }
      h1{ font-size:1.6rem; }
      .desc{ font-size:0.98rem; }
    }
  </style>
</head>
<body>
  <div class="center-box" role="main" aria-labelledby="page-title">
    <div class="brand" aria-hidden="true">
      <!-- optional: logo -->
      <!-- <img src="assets/logo.png" alt=""> -->
    </div>

    <h1 id="page-title">🃏 Joker Thief Card Game</h1>

    <div class="desc">
      A fast, fun card game to play with friends or challenge the computer. Lightweight, mobile friendly, and multiplayer-ready.
    </div>

    <div class="btn-row" role="navigation" aria-label="Play options">
      <button id="multiplayerBtn" class="landing-btn" aria-label="Play multiplayer">Play Multiplayer</button>
      <button id="computerBtn" class="landing-btn secondary" aria-label="Play against computer">Play vs Computer</button>
    </div>

    <div id="compTag" class="coming-soon" style="display:none" aria-live="polite">Coming soon!</div>
  </div>

  <script>
    document.getElementById('multiplayerBtn').addEventListener('click', function() {
      // navigate to multiplayer page in the same public folder
      window.location.href = './multiplayer.html';
    });

    document.getElementById('computerBtn').addEventListener('click', function() {
  window.location.href = './computer.html';
});
  </script>
</body>
</html>
